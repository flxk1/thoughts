<svg xmlns="http://www.w3.org/2000/svg" width="166.0mm" height="59.0mm" viewBox="-0.4 -0.4 166.8 59.8" role="img" aria-label="Propagation in the conformance vector grade-join. Actor bot, granted grade L2, proposes a token at source gate screen, which requires grade L3, so screen&#x27;s own verdict is human. screen pipes into terminal gate commit, which declares no grade and no reservation, so its own verdict is auto. commit&#x27;s effective verdict is the join, auto joined with human, which is human, read off the order auto, human, refused, reserved, prohibited. The master withholds, because only auto releases."><rect x="-0.4" y="-0.4" width="166.8" height="59.8" fill="#FFFFFF"/><text x="0.00" y="5.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">t1 {kind: act, risk: low} proposed by bot at gate screen</text><rect x="0.00" y="9.00" width="22.00" height="13.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="2.40" y="14.59" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">actor bot</text><text x="2.40" y="18.09" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">grade L2</text><rect x="32.00" y="9.00" width="34.00" height="13.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="34.40" y="14.59" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">gate screen</text><text x="34.40" y="18.09" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">requires L3</text><rect x="86.00" y="9.00" width="34.00" height="13.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="88.40" y="14.59" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">gate commit</text><text x="88.40" y="18.09" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">terminal, no grade</text><rect x="140.00" y="9.00" width="25.00" height="13.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="142.40" y="16.31" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">master</text><path d="M22.00 15.50L31.60 15.50" stroke="#111111" stroke-width="0.3" fill="none"/><path d="M30.16 16.20L31.60 15.50L30.16 14.80Z" fill="#111111" stroke="#111111" stroke-width="0.3"/><path d="M66.00 15.50L85.40 15.50" stroke="#111111" stroke-width="0.8" fill="none"/><path d="M83.42 16.46L85.40 15.50L83.42 14.54Z" fill="#111111" stroke="#111111" stroke-width="0.8"/><text x="76.00" y="13.90" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="middle">pipe</text><path d="M120.00 15.50L139.60 15.50" stroke="#111111" stroke-width="0.3" fill="none"/><path d="M138.16 16.20L139.60 15.50L138.16 14.80Z" fill="#111111" stroke="#111111" stroke-width="0.3"/><text x="32.00" y="27.00" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">own:</text><text x="40.00" y="27.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">human</text><text x="86.00" y="27.00" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">own:</text><text x="94.00" y="27.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="400" fill="#111111" text-anchor="start">auto</text><text x="86.00" y="31.20" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">effective:</text><text x="101.00" y="31.20" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">auto ⊔ human = human</text><text x="140.00" y="27.00" font-family="Archivo, Arial, sans-serif" font-size="2.822" font-weight="600" fill="#111111" text-anchor="start">withholds</text><rect x="0.00" y="40.00" width="25.00" height="8.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="12.50" y="45.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="middle">auto</text><text x="29.80" y="45.10" font-family="IBM Plex Mono, Courier New, monospace" font-size="3.175" font-weight="400" fill="#555555" text-anchor="middle">⊑</text><rect x="34.60" y="40.00" width="25.00" height="8.00" fill="#5B5B9A" stroke="#5B5B9A" stroke-width="0.3"/><text x="47.10" y="45.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#FFFFFF" text-anchor="middle">human</text><text x="64.40" y="45.10" font-family="IBM Plex Mono, Courier New, monospace" font-size="3.175" font-weight="400" fill="#555555" text-anchor="middle">⊑</text><rect x="69.20" y="40.00" width="25.00" height="8.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="81.70" y="45.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="middle">refused</text><text x="99.00" y="45.10" font-family="IBM Plex Mono, Courier New, monospace" font-size="3.175" font-weight="400" fill="#555555" text-anchor="middle">⊑</text><rect x="103.80" y="40.00" width="25.00" height="8.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="116.30" y="45.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="middle">reserved</text><text x="133.60" y="45.10" font-family="IBM Plex Mono, Courier New, monospace" font-size="3.175" font-weight="400" fill="#555555" text-anchor="middle">⊑</text><rect x="138.40" y="40.00" width="25.00" height="8.00" fill="#FFFFFF" stroke="#111111" stroke-width="0.3"/><text x="150.90" y="45.00" font-family="IBM Plex Mono, Courier New, monospace" font-size="2.822" font-weight="600" fill="#111111" text-anchor="middle">prohibited</text><text x="12.50" y="53.00" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="middle">commit&#x27;s own</text><text x="61.10" y="53.00" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="600" fill="#111111" text-anchor="middle">screen&#x27;s own = commit&#x27;s effective</text><text x="165.50" y="57.00" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="end">more restrictive →</text><text x="0.00" y="57.00" font-family="Archivo, Arial, sans-serif" font-size="2.646" font-weight="400" fill="#555555" text-anchor="start">auto: the only verdict that releases</text></svg>